# Local stack for the whole team.
#
#   docker compose up -d mongo redis qdrant      # just the datastores (run PHP on your host)
#   docker compose up -d                         # everything, incl. API + Horizon worker
#
# API:      http://localhost:8000/api
# Horizon:  http://localhost:8000/horizon
# Qdrant:   http://localhost:6333/dashboard

services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  qdrant:                      # used by Member 2's pipeline
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]

  app:
    build: .
    command: sh -c "composer install --no-interaction && php artisan serve --host=0.0.0.0 --port=8000"
    ports: ["8000:8000"]
    volumes: [".:/var/www/html"]
    environment: &app-env
      MONGODB_URI: mongodb://mongo:27017
      REDIS_HOST: redis
      QDRANT_URL: http://qdrant:6333
    depends_on: [mongo, redis, qdrant]

  horizon:
    build: .
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 3; done; php artisan horizon"
    volumes: [".:/var/www/html"]
    environment: *app-env
    depends_on: [app]

volumes:
  mongo-data:
  redis-data:
  qdrant-data:
